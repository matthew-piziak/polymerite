name: polymerite
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.11

  # PyTorch with ROCm support for AMD GPUs
  # Note: For CPU-only, use pytorch-cpu instead
  - pytorch=2.1.*
  - torchvision
  - torchaudio

  # PyTorch Geometric for Graph Neural Networks
  - pyg=2.4.*
  - pytorch-scatter
  - pytorch-sparse
  - pytorch-cluster

  # Chemistry and Molecular Libraries
  - rdkit=2023.*
  - openbabel

  # Deep Learning Utilities
  - transformers  # HuggingFace for ChemBERTa
  - tokenizers

  # Scientific Computing
  - numpy=1.24.*
  - pandas=2.0.*
  - scipy
  - scikit-learn=1.3.*

  # Data Visualization
  - matplotlib=3.7.*
  - seaborn

  # Jupyter and Development
  - jupyter
  - ipython
  - notebook

  # Utilities
  - tqdm
  - pyyaml
  - requests

  # pip packages not available via conda
  - pip
  - pip:
      - pytorch-lightning>=2.0.0
      - wandb  # For experiment tracking (optional)
      - optuna  # For hyperparameter optimization

# Installation instructions:
#
# For AMD GPU (ROCm):
#   1. First install ROCm drivers: https://rocm.docs.amd.com/
#   2. Install PyTorch with ROCm:
#      pip3 install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/rocm5.7
#   3. Create environment: mamba env create -f environment.yml
#   4. Activate: mamba activate polymerite
#
# For CPU only:
#   1. Replace pytorch=2.1.* with pytorch-cpu=2.1.*
#   2. Create environment: mamba env create -f environment.yml
#   3. Activate: mamba activate polymerite
#
# For NVIDIA GPU (CUDA):
#   1. Check CUDA version: nvidia-smi
#   2. Install PyTorch with matching CUDA:
#      pip3 install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
#   3. Create environment: mamba env create -f environment.yml
#   4. Activate: mamba activate polymerite
